# PROD: db + backend + frontend. Only the frontend port (3000) is published;
# the backend stays internal to the compose network (SPEC §14). LAN/Tailscale only.
# Explicit project name = the historical default (directory name), so the existing
# selfhostedpt_pgdata / selfhostedpt_media volumes keep attaching even if the repo
# dir is renamed. Dev uses `homeshred-dev`, so the two never share a volume.
name: selfhostedpt

services:
  db:
    image: postgres:17
    env_file: .env.prod # provides POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env.prod
    environment:
      MEDIA_DIR: /app/media # progress photos + Piper TTS voices/cache; persisted on the volume below
      # Voice-coach TTS is on by default; voice models live under MEDIA_DIR/tts/voices.
      # After first deploy run `make prod-tts-voices` to populate them (until then the
      # frontend falls back to browser speech). Set TTS_ENABLED=false to disable.
      TTS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - media:/app/media
    # no host port published — reachable inside the network as "backend".

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3006:3000" # the ONLY exposed port (host 3000 is taken on this box → 3006)
    restart: unless-stopped

volumes:
  pgdata:
  media:
