# DEV compose: postgres + adminer only.
# Backend and frontend run on the host (uv run / pnpm dev) during development.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: homeshred
      POSTGRES_PASSWORD: homeshred
      POSTGRES_DB: homeshred
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeshred"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
