[project]
name = "homeshred-backend"
version = "0.1.0"
description = "HomeShred — self-hosted rule-based personal trainer (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "piper-tts>=1.2,<2",
]

[project.optional-dependencies]
# Higher-quality Vietnamese voice coach (F5-TTS). Heavy (torch + f5-tts) and
# deliberately NOT installed in the runtime image — install on a host that
# pre-generates cues: `uv pip install -e '.[f5]'` (or the isolated venv used by
# `make tts-f5`). Without it, tts_vi_engine="f5" silently falls back to Piper.
f5 = [
    # torchaudio >=2.9 hard-requires torchcodec, whose prebuilt libs pull CUDA
    # (libnvrtc) and fail to load on CPU-only hosts; 2.4.x keeps the native
    # soundfile backend. Pin the pair to that known-good CPU range.
    "torch>=2.2,<2.5",
    "torchaudio>=2.2,<2.5",
    "f5-tts>=1.1",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends()` in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
